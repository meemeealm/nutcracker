# Fluid Canvas ML & Song Swirl Dynamics Configuration
# Defines model topologies, song feature timelines, and visual swirl behaviors.

version: "1.0"

# Global ML inference runtime settings
ml_engine:
  default_model_path: "/ml/browser/model.json"
  model_format: "auto" # "auto", "graph", or "layers"
  input_dimension: 31
  output_dimensions: 8
  output_keys:
    - "flow_strength"
    - "turbulence"
    - "pigment_spread"
    - "displacement"
    - "warp"
    - "color_shift"
    - "detail"
    - "activity"
  inference_throttle_ms: 45
  interpolation:
    enabled: true
    lerp_factor: 0.12 # Smooth glide between neural predictions

# Fluid canvas rendering defaults
rendering:
  mesh_resolution: 128
  plane_size: 8.0
  default_texture: "/textures/default.webp"

# Per-song configuration
# Controls which feature timeline JSON and neural model to load,
# plus song-specific swirl characteristics (turbulence, flow speed, pigment dispersion).
songs:
  beyond-love:
    title: "Beyond Love"
    artist: "Beach House"
    model_path: "/ml/browser/model.json"
    features_path: "/ml/beach_house.json"
    mood: "dreamy_ethereal"
    swirl_profile:
      flow_multiplier: 1.25
      turbulence_bias: 0.18
      pigment_spread_scale: 1.30
      warp_factor: 1.15
      color_shift_intensity: 1.20
      displacement_scale: 1.05
      detail_boost: 1.00
      activity_boost: 1.15

