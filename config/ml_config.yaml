# Fluid Canvas ML & Song Dynamics Configuration
# Points each song to its feature/swirl JSON files in the public folder.

version: "1.0"

ml_engine:
  default_model_path: "/ml/browser/model.json"
  model_format: "auto"
  inference_throttle_ms: 45
  interpolation:
    enabled: true
    lerp_factor: 0.12

rendering:
  mesh_resolution: 128
  plane_size: 8.0
  default_texture: "/textures/default.webp"

# Per-song configuration
# Swirl parameters are loaded dynamically from the JSON files in the public folder.
songs:
  beyond-love:
    title: "Beyond Love"
    artist: "Beach House"
    features_path: "/ml/beyond_love_beach_house_features.json"

  catch-the-rainbow:
